<div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
  <div class="card-body p-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
    
    <!-- Title and Icon -->
    <div class="d-flex align-items-center gap-3">
      <div class="bg-primary-subtle text-primary rounded-3 d-flex align-items-center justify-content-center" style="width:48px; height:48px;">
        <i class="bi bi-person-workspace fs-4"></i>
      </div>
      <div>
        <h4 class="fw-bold text-dark mb-0">Management Portal</h4>
        <p class="text-muted small mb-0">Track employee timelines, profiles, and generate resumes.</p>
      </div>
    </div>

    <!-- User Profile & Session Controls -->
    <div class="d-flex align-items-center gap-3 justify-content-between justify-content-md-end w-100 w-md-auto border-top border-md-top-0 pt-3 pt-md-0">
      <div class="text-md-end">
        <span class="text-muted small d-block">Logged in as</span>
        <span class="fw-bold text-dark"><i class="bi bi-shield-check text-success me-1"></i>{{ request.user.username }}</span>
      </div>
      <div class="bg-light rounded-circle text-primary border d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px; font-size: 1rem;">
        {{ request.user.username|slice:":1"|upper }}
      </div>
    </div>

  </div>
</div>
