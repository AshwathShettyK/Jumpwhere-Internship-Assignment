version: '3.9'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn ResumeForge.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    ports:
      - '8000:8000'
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  db_data:
