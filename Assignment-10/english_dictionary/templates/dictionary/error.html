{% extends 'dictionary/base.html' %}

{% block title %}Word Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h1 class="card-title">Word not found</h1>
                <p class="lead">We could not find definitions for <strong>{{ word }}</strong>.</p>
                <p>Please check the spelling or try another word.</p>
                <a class="btn btn-primary" href="{% url 'dictionary:home' %}">Search again</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
