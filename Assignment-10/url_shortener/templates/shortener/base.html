<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}URL Shortener{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-EVSTQN3/azprG1AnmDkFnpS2T9xY7Q5R5N1ZLZ9Wq8S1ljzN4cT9a5A0XNeAIdw1" crossorigin="anonymous" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    <header class="bg-dark text-white py-3">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <a class="navbar-brand text-white" href="{% url 'shortener:home' %}">URL Shortener</a>
            <nav>
                <a class="text-white me-3" href="{% url 'shortener:home' %}">Home</a>
                <a class="text-white" href="{% url 'admin:index' %}">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light py-4 mt-auto">
        <div class="container text-center text-muted">
            <p class="mb-0">Built with Django and Bootstrap 5 | Simple URL shortening for learning.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
